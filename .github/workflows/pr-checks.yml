name: PR Validation Checks

on:
  pull_request:
    branches:
        - main
    
jobs:
    file-size-check:
        runs-on: ubuntu-latest

        steps:
            - name: Git checkout code
              uses: actions/checkout@v7

            - name: Check file sizes
              run: |
                echo "Checking for files larger than 1 MB..."

                LARGE_FILES=$(find . -type f -not -path './.git/*' -size +1M)

                if [ -n "$LARGE_FILES"]; then
                   echo "The following files are larger than 1 MB:"
                   echo "$LARGE_FILES"
                   exit 1
                else
                   echo "All files are within the 1 MB limit."
                fi

    branch-name-check:
        runs-on: ubuntu-latest
        steps:
            - name: Check branch name
              env:
                BRANCH_NAME: ${{github.head_ref}}
              run: |
                echo "Checking branch name: $BRANCH_NAME"
                if [[ "$BRANCH_NAME" =~ ^(feature|fix|docs)/.+$ ]]; then
                   echo "Branch name is valid."
                else
                   echo "Invalid branch name: $BRANCH_NAME"
                   echo "Allowed patterns: feature/*, fix/*, docs/*"
                   exit 1
                fi

        
    pr-body-check:
        runs-on: ubuntu-latest
        steps:
            - name:  Check PR description
              env:
                PR_BODY: ${{github.event.pull_request.body}} 
              run: |
                if [ -z "$PR_BODY" ]; then
                   echo "::warning::Pull request description is empty."
                else
                   echo "Pull request description is present." 
                fi             